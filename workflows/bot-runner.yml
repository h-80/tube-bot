name: Automated YouTube & Gemini Bot

on:
  schedule:
    # يعمل تلقائياً كل يوم مرة واحدة
    - cron: '0 0 * * *'
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى شئت بضغطة زر

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests google-api-python-client google-generativeai

      - name: Run Bot Script
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot.py
